[project]
name = "world-models"
version = "0.1.0"
description = "World models from scratch in JAX: bouncing ball, RSSM, then DOOM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax[cpu]",
    "flax",
    "optax",
    "distrax",
    "gymnax",
    "matplotlib",
    "numpy",
]

[project.optional-dependencies]
wandb = ["wandb"]
# GPU training runs under WSL2 (JAX has no native Windows CUDA support);
# see docs/gpu-setup.md. The marker keeps Windows installs CPU-only.
cuda = ["jax[cuda12]; sys_platform == 'linux'"]

[project.scripts]
ball-demo = "world_models.demo:main"
make-data = "world_models.data:main"
train-vae = "world_models.train_vae:main"

[dependency-groups]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_models"]
