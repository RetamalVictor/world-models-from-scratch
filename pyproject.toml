[project]
name = "world-models"
version = "0.1.0"
description = "World models from scratch in JAX: bouncing ball, RSSM, then DOOM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax[cpu]",
    "flax",
    "optax",
    "distrax",
    "gymnax",
    "matplotlib",
]

[project.scripts]
ball-demo = "world_models.demo:main"

[dependency-groups]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_models"]
